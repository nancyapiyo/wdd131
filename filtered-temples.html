<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtered Temple Album</title>
    <meta name="description" content="Explore and filter a photo album of temples of The Church of Jesus Christ of Latter-day Saints.">
    <meta name="author" content="Nancy Apiyo">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/filtered-temples.css">
    <link rel="stylesheet" href="styles/filtered-temples-large.css">
    <script src="scripts/filtered-temples.js" defer></script>
</head>

<body>
    <header class="site-header">
        <p class="site-title">Temple Album</p>
        <button class="menu-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false"
            aria-controls="primary-navigation">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav id="primary-navigation" class="primary-navigation" aria-label="Main navigation">
            <a href="#gallery" data-filter="home" aria-current="page">Home</a>
            <a href="#gallery" data-filter="old">Old</a>
            <a href="#gallery" data-filter="new">New</a>
            <a href="#gallery" data-filter="large">Large</a>
            <a href="#gallery" data-filter="small">Small</a>
        </nav>
    </header>
    <main id="gallery">
        <h1>Home</h1>
        <section class="temple-grid" aria-label="Temple photographs" aria-live="polite"></section>
    </main>
    <footer class="site-footer">
        <p>&copy; <span id="current-year"></span> | Nancy Apiyo | Temple Album</p>
        <p>Last modified: <span id="last-modified"></span></p>
    </footer>
</body>

</html>
